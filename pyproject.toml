[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricesense"
version = "1.0.0"
description = "Promotion targeting with randomized experiments and uplift modelling"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "scipy>=1.10,<2.0",
  "matplotlib>=3.7,<4.0",
  "plotly>=5.18,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
